baseURL = "https://sguzman.github.io/marginalia/"
languageCode = "en-us"
title = "Marginalia"
theme = "coder"

[params]
avatarURL = "images/avatar.png"
customCSS = ["css/custom.css"]
math = true

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]
    [markup.goldmark.renderer]
      unsafe = true

[taxonomies]
author = "authors"
category = "categories"
tag = "tags"
