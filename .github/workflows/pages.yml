name: Build and Deploy Hugo Blog

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - name: Checkout Marginalia
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Checkout canonical research corpus
        uses: actions/checkout@v4
        with:
          repository: sguzman/ai-research-reports
          ref: main
          path: .canonical/ai-research-reports
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install publication dependency
        run: python -m pip install PyYAML

      - name: Materialize approved research content
        shell: bash
        run: |
          set -euo pipefail
          # `content/posts` is the migration-era mirror. Keep it in Git history,
          # but remove it from the ephemeral build so stale/unreviewed copies
          # cannot remain reachable on the deployed site.
          rm -rf content/posts
          python scripts/research_publish.py \
            --source .canonical/ai-research-reports \
            --all \
            --write
          echo 'Derived research files:'
          find content/research -type f -maxdepth 4 -print | sort || true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build Site
        run: hugo --minify

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
